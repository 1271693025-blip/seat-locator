            padding: 20px;

            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;

        h1 {

            color: #333;
            margin-bottom: 30px;

        .search-box {
            display: flex;
            gap: 10px;

        }
        #nameInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        #searchBtn {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        #searchBtn:hover {
            background-color: #0056b3;
        }
        .result {
            padding: 20px;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .error {
